services:
  api:
    build: ./backend/UserDirectory.Api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Path: /data/app.db
    volumes:
      - user-directory-data:/data
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  user-directory-data:
